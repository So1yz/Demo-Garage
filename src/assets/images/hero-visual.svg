<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Technische visualisatie van moderne automotive werkplaats en voertuigdiagnose">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1013" />
      <stop offset="50%" stop-color="#14171d" />
      <stop offset="100%" stop-color="#1a1e26" />
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d333e" />
      <stop offset="40%" stop-color="#4b5563" />
      <stop offset="70%" stop-color="#e85d04" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
    <radialGradient id="glowPoint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e85d04" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e85d04" stop-opacity="0" />
    </radialGradient>
    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep Canvas -->
  <rect width="960" height="640" fill="url(#bgGrad)" />
  <rect width="960" height="640" fill="url(#techGrid)" />

  <!-- Ambient Glow behind car silhouette -->
  <circle cx="520" cy="360" r="280" fill="url(#glowPoint)" />

  <!-- Technical Datum & Alignment Axes -->
  <line x1="80" y1="440" x2="880" y2="440" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="160" y1="120" x2="160" y2="520" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <line x1="800" y1="120" x2="800" y2="520" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Precision Crosshairs -->
  <g stroke="#e85d04" stroke-width="1.5" opacity="0.8">
    <path d="M 150 440 L 170 440 M 160 430 L 160 450" />
    <path d="M 790 440 L 810 440 M 800 430 L 800 450" />
    <circle cx="160" cy="440" r="16" fill="none" stroke="rgba(232, 93, 4, 0.4)" stroke-dasharray="2 2" />
    <circle cx="800" cy="440" r="16" fill="none" stroke="rgba(232, 93, 4, 0.4)" stroke-dasharray="2 2" />
  </g>

  <!-- Aerodynamic Vehicle Contour (European Coupe Silhouette) -->
  <path d="M 120 440 
           L 180 440 
           C 210 390, 290 390, 320 440 
           L 620 440 
           C 650 390, 730 390, 760 440 
           L 840 440 
           C 855 440, 865 425, 860 405 
           C 845 350, 780 340, 720 335 
           C 660 330, 560 250, 480 230 
           C 380 205, 260 270, 200 320 
           C 150 360, 110 395, 105 420 
           C 102 435, 110 440, 120 440 Z" 
        fill="rgba(20, 24, 31, 0.9)" 
        stroke="url(#chassisGrad)" 
        stroke-width="2.5" />

  <!-- Roofline & Glasshouse Definition -->
  <path d="M 270 320 
           C 330 250, 400 240, 480 245 
           C 545 250, 620 300, 680 330 
           L 270 330 Z" 
        fill="rgba(14, 16, 19, 0.85)" 
        stroke="rgba(255, 255, 255, 0.25)" 
        stroke-width="1.5" />

  <line x1="460" y1="245" x2="455" y2="330" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

  <!-- Precision Wheel Assemblies -->
  <!-- Front Wheel -->
  <g transform="translate(250, 440)">
    <circle cx="0" cy="0" r="54" fill="#0e1013" stroke="#4b5563" stroke-width="3" />
    <circle cx="0" cy="0" r="38" fill="#181a1d" stroke="#e85d04" stroke-width="1.5" stroke-dasharray="6 3" />
    <circle cx="0" cy="0" r="14" fill="#2d333e" stroke="#9ca3af" stroke-width="2" />
    <!-- Caliper Accent -->
    <path d="M -22 -24 A 32 32 0 0 1 -4 -32" stroke="#e85d04" stroke-width="7" fill="none" stroke-linecap="round" />
  </g>

  <!-- Rear Wheel -->
  <g transform="translate(690, 440)">
    <circle cx="0" cy="0" r="54" fill="#0e1013" stroke="#4b5563" stroke-width="3" />
    <circle cx="0" cy="0" r="38" fill="#181a1d" stroke="#e85d04" stroke-width="1.5" stroke-dasharray="6 3" />
    <circle cx="0" cy="0" r="14" fill="#2d333e" stroke="#9ca3af" stroke-width="2" />
    <!-- Caliper Accent -->
    <path d="M -22 -24 A 32 32 0 0 1 -4 -32" stroke="#e85d04" stroke-width="7" fill="none" stroke-linecap="round" />
  </g>

  <!-- Optical Headlight Accent (Precision Laser Vector) -->
  <path d="M 130 380 L 195 383" stroke="#f8f9fa" stroke-width="3" stroke-linecap="round" />
  <path d="M 125 385 L 180 387" stroke="#e85d04" stroke-width="2" stroke-linecap="round" />

  <!-- Taillight Blade Accent -->
  <path d="M 830 365 L 855 372" stroke="#e85d04" stroke-width="3.5" stroke-linecap="round" />

  <!-- Technical Telemetry & Metadata Card Overlay -->
  <g transform="translate(80, 80)">
    <rect width="270" height="92" rx="8" fill="rgba(14, 16, 19, 0.82)" stroke="rgba(255, 255, 255, 0.1)" />
    <circle cx="24" cy="28" r="4" fill="#e85d04" />
    <text x="36" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#f3f4f6" text-transform="uppercase">WERKPLAATS DIAGNOSTIEK</text>
    <text x="24" y="58" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9ca3af">CHASSIS SCAN: STATUS OPTIMAAL</text>
    <text x="24" y="76" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e85d04">CAN-BUS TELEMETRIE: 0 STORINGEN</text>
  </g>

  <!-- Technical Calibration Badge Lower Right -->
  <g transform="translate(680, 530)">
    <rect width="200" height="50" rx="6" fill="rgba(14, 16, 19, 0.82)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9ca3af">RDW IJKING: CONFORM</text>
    <text x="16" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#f3f4f6">ROTTERDAM WERKPLAATS</text>
  </g>
</svg>

